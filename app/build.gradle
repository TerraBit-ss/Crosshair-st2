plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.crosshair'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.crosshair'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Постоянный ключ подписи: без него каждая сборка в GitHub подписывается
    // новым ключом, и обновление поверх старой версии не устанавливается.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
